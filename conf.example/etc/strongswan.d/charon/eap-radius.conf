# Forward EAP (EAP-MSCHAPv2) to the RADIUS server, like SoftEther does with
# `RadiusUsePeapInsteadOfEap false`. Included in charon.plugins.
eap-radius {
    load = yes
    servers {
        # The router allows RADIUS to ratschefummel only from listed
        # networks, so add the gateway's /31 there, and the gateway's
        # ADDRESS (etc/netns.conf) as client to the RADIUS server.
        ratschefummel {
            address = 141.14.21.74
            # The shared secret is set in eap-radius-secret.conf next to this
            # file, which git ignores:
            #
            # eap-radius {
            #     servers {
            #         ratschefummel {
            #             secret = ...
            #         }
            #     }
            # }
        }
    }
}
