# Log to PREFIX/logs, shared by all deployments. charon does not change its
# working directory, and startstop.sh starts it in PREFIX.
charon {
    filelog {
        charon {
            path = logs/charon.log
            time_format = %F %T
            # Prefix entries with the connection name and IKE_SA number, so
            # the entries of one client can be found.
            ike_name = yes
            flush_line = yes
            default = 1
        }
    }
}
