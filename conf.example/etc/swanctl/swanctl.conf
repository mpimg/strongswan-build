# IKEv2 remote access with the clients built into Windows, macOS, iOS,
# Android, ChromeOS and GNU/Linux (NetworkManager): the gateway authenticates
# with a certificate from a public CA, the users with their password through
# EAP-MSCHAPv2, checked by the RADIUS server (etc/strongswan.d/charon/
# eap-radius.conf).
#
# The algorithm proposals are strongSwan's defaults, which the clients of
# macOS, iOS, Android and ChromeOS share. Windows proposes only weak ones
# (DH group 2) by default, so set stronger ones on Windows with
# Set-VpnConnectionIPsecConfiguration, instead of weakening the gateway.

connections {
    clients {
        version = 2
        pools = clients

        # swanctl loads the certificate from x509/ and its key from private/.
        # Send it also to clients that send no certificate request, for
        # example as they do not know the issuing CA.
        send_cert = always

        # Several devices of a user share the EAP identity, and clients send
        # INITIAL_CONTACT, which deletes the other SAs of the identity, so
        # do not enforce uniqueness. Dead peer detection frees the address of
        # a vanished client instead.
        unique = never
        dpd_delay = 60s

        local {
            auth = pubkey
            # TODO: The host name users enter, which must be a subjectAltName
            # (dNSName) of the certificate.
            id = ikev2.molgen.mpg.de
        }
        remote {
            auth = eap-radius
            # Ask the client for its user name (EAP-Identity), as Windows
            # sends its IP address as IKE identity.
            eap_id = %any
        }
        children {
            clients {
                # Full tunnel, like the default of L2TP clients.
                local_ts = 0.0.0.0/0
            }
        }
    }
}

pools {
    clients {
        # The upper half of the VPN client network NET_VPNX, the lower half
        # is SoftEther's. The router routes it to the gateway.
        addrs = 141.14.14.128/25
        dns = 141.14.16.1
    }
}
